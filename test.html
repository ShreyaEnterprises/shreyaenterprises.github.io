
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreya Enterprises – Notification Card</title>

<style>
*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  padding:20px;
  background:#f7f7f7;
}

/* ===== CARD (DESKTOP / TABLET) ===== */
.notify-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
  max-width:900px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:center; /* vertically center content */
  gap:20px;
  border-left:6px solid #cc5500;
}

/* Image (Desktop) */
.card-img img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}

/* Content Wrapper */
.card-content-wrapper{
  display:flex;
  flex:1;
  justify-content:space-between; /* content left, button right */
  align-items:center; /* vertical center */
}

/* Content */
.card-content{
  max-width:70%;
}

.card-content h3{
  margin:0 0 8px;
  font-size:22px;
  color:#222;
}

.card-content p{
  color:#666;
  font-size:15px;
  line-height:1.6;
  margin:0;
}

/* Button */
.btn{
  padding:12px 28px;
  background:#cc5500;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  white-space:nowrap;
}

.btn:hover{
  background:#a84400;
}

/* ===== MOBILE VIEW ===== */
@media (max-width:768px){

  .notify-card{
    flex-direction:column;
    text-align:center;
    border-left:none;
    border-top:6px solid #cc5500;
  }

  .card-img{
    margin-top:20px;
  }

  .card-img img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 12px 28px rgba(0,0,0,0.30);
  }

  .card-content-wrapper{
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .card-content{
    max-width:100%;
    padding:20px;
  }

  .card-content h3{
    font-size:20px;
  }

  .btn{
    width:100%;
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="notify-card">

  <!-- IMAGE -->
  <div class="card-img">
    <img src="https://shreyaenterprises.github.io/construction/images/shreya-construction.jpg" alt="Shreya Construction">
  </div>

  <!-- CONTENT + BUTTON WRAPPER -->
  <div class="card-content-wrapper">

    <!-- CONTENT LEFT -->
    <div class="card-content">
      <h3>Cranes (40 Ton to 200 Ton)</h3>
      <p>
        A wide range of heavy-duty cranes from 40 Ton to 200 Ton capacity for rent.
        Ideal for lifting and shifting large industrial machinery and construction materials.
      </p>
    </div>

    <!-- BUTTON RIGHT -->
    <a href="#" class="btn">View Details</a>

  </div>

</div>

</body>
</html>
