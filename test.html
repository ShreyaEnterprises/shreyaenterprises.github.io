<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreya Enterprises – Notification Card</title>

<style>
:root {
  --sky-blue: #00bfff; /* sky-blue color */
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  padding:20px;
  background:#f7f7f7;
}

/* ===== CARD (DESKTOP / TABLET) ===== */
.notify-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
  max-width:900px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:center;
  gap:20px;
  border-left:6px solid var(--sky-blue); /* notification border sky-blue */
}

/* Image (Desktop) */
.card-img img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

/* Content */
.card-content{
  flex:1;
  display:flex;
  flex-direction:column;
}

.card-content h3{
  margin:6px 0 8px;
  font-size:22px;
  color:#222;
}

.card-content h3 span{
  color: var(--sky-blue); /* Shreya in sky-blue */
}

.card-content p{
  color:#666;
  font-size:15px;
  line-height:1.6;
  margin:0 0 auto; /* push button to bottom */
}

/* Button */
.btn{
  display:inline-block;
  margin-top:14px;
  padding:12px 28px;
  background:#000; /* black */
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  align-self:flex-end; /* desktop right */
  transition:0.3s ease;
}

.btn:hover{
  background: var(--sky-blue); /* hover sky-blue */
  color:#fff;
}

/* ===== MOBILE VIEW ===== */
@media (max-width:768px){

  .notify-card{
    flex-direction:column;
    text-align:center;
    border-left:none;
    border-top:6px solid var(--sky-blue); /* mobile top border */
  }

  .card-img{
    margin-top:20px;
  }

  /* Circle + shadow */
  .card-img img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 12px 28px rgba(0,0,0,0.30);
  }

  .card-content{
    padding:20px;
  }

  .card-content h3{
    font-size:20px;
  }

  .btn{
    width:100%;
    padding:14px;
    align-self:auto; /* full width on mobile */
  }
}
</style>
</head>

<body>

<!-- NOTIFICATION CARD -->
<div class="notify-card">

  <!-- IMAGE -->
  <div class="card-img">
    <img src="https://shreyaenterprises.github.io/construction/images/shreya-construction.jpg" alt="Shreya Construction">
  </div>

  <!-- CONTENT -->
  <div class="card-content">
    <h3><span>Shreya</span> Construction</h3>
    <p>
      A wide range of heavy-duty cranes from 40 Ton to 200 Ton capacity for rent.
      Ideal for lifting and shifting large industrial machinery and construction materials.
    </p>
    <a href="#" class="btn">View Details</a>
  </div>

</div>

</body>
</html>
