<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreya Enterprises – Notification Card</title>

<style>
:root {
  --sky-blue: #00bfff;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  padding:20px;
  background:#f7f7f7;
}

/* ===== CARD (DESKTOP / TABLET) ===== */
.notify-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
  max-width:900px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:stretch; /* make content & button equal height */
  gap:20px;
  border-left:6px solid var(--sky-blue);
}

/* Image */
.card-img img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

/* CONTENT + BUTTON WRAPPER FOR DESKTOP */
.card-content-wrapper{
  flex:1;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

/* Content */
.card-content{
  flex:1;
}

.card-content h3{
  margin:0 0 10px;
  font-size:22px;
}

.card-content h3 span{
  color: var(--sky-blue);
}

.card-content p{
  color:#666;
  font-size:15px;
  line-height:1.6;
  margin:0;
}

/* Button */
.btn{
  display:inline-block;
  padding:12px 28px;
  background:#000;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  align-self:center; /* vertically center in flex */
  transition:0.3s ease;
}

.btn:hover{
  background: var(--sky-blue);
}

/* ===== MOBILE VIEW ===== */
@media (max-width:768px){

  .notify-card{
    flex-direction:column;
    text-align:center;
    border-left:none;
    border-top:6px solid var(--sky-blue);
    padding:0;
  }

  .card-content-wrapper{
    flex-direction:column;
    align-items:center;
  }

  .card-img{
    margin-top:20px;
  }

  .card-img img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 12px 28px rgba(0,0,0,0.30);
  }

  .card-content{
    padding:20px;
  }

  .card-content h3{
    font-size:20px;
  }

  .btn{
    width:100%;
    padding:14px;
    align-self:auto;
  }
}
</style>
</head>

<body>

<div class="notify-card">

  <!-- IMAGE -->
  <div class="card-img">
    <img src="https://shreyaenterprises.github.io/construction/images/shreya-construction.jpg" alt="Shreya Construction">
  </div>

  <!-- CONTENT + BUTTON WRAPPER -->
  <div class="card-content-wrapper">
    <div class="card-content">
      <h3><span>Shreya</span> Construction</h3>
      <p>
        A wide range of heavy-duty cranes from 40 Ton to 200 Ton capacity for rent.
        Ideal for lifting and shifting large industrial machinery and construction materials.
      </p>
    </div>
    <a href="#" class="btn">View Details</a>
  </div>

</div>

</body>
</html>
