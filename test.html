<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreya Enterprises – Notification Card</title>

<style>
*{
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  padding:20px;
  background:#f7f7f7;
}

/* ===== CARD (DESKTOP / TABLET) ===== */
.notify-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
  max-width:900px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:center;
  gap:20px;
  border-left:6px solid #cc5500;
}

/* Image (Desktop) */
.card-img img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

/* Content */
.card-content{
  flex:1;
}

.tag{
  color:#cc5500;
  font-weight:700;
  font-size:13px;
  letter-spacing:1px;
}

.card-content h3{
  margin:6px 0 8px;
  font-size:22px;
  color:#222;
}

.card-content p{
  color:#666;
  font-size:15px;
  line-height:1.6;
  margin:0;
}

/* Button */
.btn{
  display:inline-block;
  margin-top:14px;
  padding:12px 28px;
  background:#cc5500;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  transition:0.3s ease;
}

.btn:hover{
  background:#a84400;
}

/* ===== MOBILE VIEW (CIRCLE IMAGE) ===== */
@media (max-width:768px){

  .notify-card{
    flex-direction:column;
    text-align:center;
    border-left:none;
    border-top:6px solid #cc5500;
  }

  .card-img{
    margin-top:20px;
  }

  /* 🔥 100% ROUNDED IMAGE */
  .card-img img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
  }

  .card-content{
    padding:20px;
  }

  .card-content h3{
    font-size:20px;
  }

  .btn{
    width:100%;
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="notify-card">

  <!-- IMAGE -->
  <div class="card-img">
    <img src="https://shreyaenterprises.github.io/construction/images/shreya-construction.jpg" alt="Shreya Construction">
  </div>

  <!-- CONTENT -->
  <div class="card-content">
    <span class="tag">CRANE</span>
    <h3>Cranes (40 Ton to 200 Ton)</h3>
    <p>
      A wide range of heavy-duty cranes from 40 Ton to 200 Ton capacity for rent.
      Ideal for lifting and shifting large industrial machinery and construction materials.
    </p>
    <a href="#" class="btn">View Details</a>
  </div>

</div>

</body>
</html>
