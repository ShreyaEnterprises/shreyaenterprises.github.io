<!--
Auto-updating Sitemap (single-file HTML + CSS + JS)

How it works:
1. At runtime the page attempts to fetch `/sitemap.json` (preferred) which should be a small JSON index of pages/posts.
   Example sitemap.json:
   {
     "pages": [
       { "title": "Home", "url": "/", "date": "2025-11-10", "tags": ["site"] },
       { "title": "Blog Post 1", "url": "/blog/post-1.html", "date": "2025-11-12", "tags": ["blog","js"] }
     ]
   }

2. If `/sitemap.json` is not found, it falls back to `/sitemap.xml` (standard XML sitemap) and extracts the <loc> and <lastmod> fields.
3. The UI renders a searchable, filterable list. This is client-side so it updates automatically as soon as the JSON/XML is updated on the server.

Notes:
- A purely HTML+CSS site can't "discover" files on the server without some index (JSON/XML). Your static site generator or server should produce /sitemap.json or /sitemap.xml.
- If you need help generating sitemap.json from your build system (Hugo, Jekyll, Eleventy, WordPress REST API), tell me which system and I'll give the integration.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site Map — Shreya Enterprises, Bharuch</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#94a3b8;--accent:#60a5fa;--glass:rgba(255,255,255,0.03)}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{background:linear-gradient(180deg,#071022 0%, #081226 100%);color:#e6eef8;padding:28px;}
    .wrap{max-width:960px;margin:0 auto}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#4ade80);display:flex;align-items:center;justify-content:center;font-weight:700;color:#032;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    h1{font-size:20px;margin:0}
    p.lead{margin:4px 0 0;color:var(--muted);font-size:14px}

    .controls{display:flex;gap:12px;margin:18px 0 24px;align-items:center}
    .search{flex:1}
    input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:var(--glass);color:inherit}
    select{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}

    .stats{color:var(--muted);font-size:13px}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);box-shadow:0 6px 18px rgba(2,6,23,0.5)}
    .card a{color:#cbe7ff;text-decoration:none;font-weight:600}
    .meta{color:var(--muted);font-size:13px;margin-top:8px}
    .tags{margin-top:10px}
    .tag{display:inline-block;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.03);font-size:12px;margin-right:6px}

    footer{margin-top:28px;color:var(--muted);font-size:13px}

    @media (max-width:560px){header{flex-direction:column;align-items:flex-start}
      .controls{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">S</div>
      <div>
        <h1>Auto-updating Sitemap</h1>
        <p class="lead">This page lists pages/posts automatically by fetching <code>/sitemap.json</code> or falling back to <code>/sitemap.xml</code>.</p>
      </div>
    </header>

    <div class="controls">
      <div class="search">
        <input id="search" type="search" placeholder="Search title or URL, e.g. 'blog'" aria-label="Search sitemap" />
      </div>
      <select id="filterTags" aria-label="Filter by tag">
        <option value="">All tags</option>
      </select>
      <div class="stats" id="stats">Loading…</div>
    </div>

    <main>
      <div id="results" class="grid" aria-live="polite"></div>
      <noscript>
        <p style="color:var(--muted)">JavaScript is required to auto-load the sitemap. Provide a static list here if needed.</p>
      </noscript>
    </main>

    <footer>
      Tip: Have your build step produce <code>/sitemap.json</code> with page objects ({title,url,date,tags}). If you only have <code>/sitemap.xml</code>, this page will parse it.
    </footer>
  </div>

  <script>
    // Helper: format date (YYYY-MM-DD -> friendly)
    function fmtDate(d){ if(!d) return ''; try{ const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(); } catch(e){return d} }

    // Render function
    function render(items){
      const container = document.getElementById('results');
      container.innerHTML = '';
      if(!items.length){ container.innerHTML = '<p style="color:var(--muted)">No pages found.</p>'; return }
      items.forEach(it=>{
        const card = document.createElement('article'); card.className='card';
        const a = document.createElement('a'); a.href = it.url; a.textContent = it.title || it.url; a.target = '_self';
        card.appendChild(a);
        const meta = document.createElement('div'); meta.className='meta'; meta.textContent = (it.date? fmtDate(it.date)+' · ' : '') + (it.url||'');
        card.appendChild(meta);
        if(it.tags && it.tags.length){
          const tags = document.createElement('div'); tags.className='tags';
          it.tags.forEach(t=>{ const span = document.createElement('span'); span.className='tag'; span.textContent=t; tags.appendChild(span); });
          card.appendChild(tags);
        }
        container.appendChild(card);
      })
    }

    // Populate tag filter
    function populateTags(items){
      const select = document.getElementById('filterTags');
      const set = new Set(); items.forEach(it=> (it.tags||[]).forEach(t=>set.add(t)));
      // Clear except first option
      select.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());
      [...set].sort().forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; select.appendChild(o); });
    }

    // Simple search & filter
    function filterItems(items){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const tag = document.getElementById('filterTags').value;
      return items.filter(it=>{
        if(tag && !(it.tags||[]).includes(tag)) return false;
        if(!q) return true;
        return (it.title||'').toLowerCase().includes(q) || (it.url||'').toLowerCase().includes(q);
      })
    }

    // Try JSON first, then XML
    async function loadSitemap(){
      const stats = document.getElementById('stats');
      try{
        const jsonResp = await fetch('/sitemap.json', {cache:'no-store'});
        if(jsonResp.ok){
          const data = await jsonResp.json();
          const items = normalizeFromJSON(data);
          populateTags(items);
          render(items);
          stats.textContent = `${items.length} items (from sitemap.json)`;
          wireFiltering(items);
          return;
        }
      }catch(e){ /* ignore, try xml */ }

      // fallback sitemap.xml
      try{
        const xmlResp = await fetch('/sitemap.xml', {cache:'no-store'});
        if(xmlResp.ok){
          const xmlText = await xmlResp.text();
          const items = parseSitemapXML(xmlText);
          populateTags(items);
          render(items);
          stats.textContent = `${items.length} items (from sitemap.xml)`;
          wireFiltering(items);
          return;
        }
      }catch(e){ console.error(e); }

      stats.textContent = 'No sitemap.json or sitemap.xml found.';
      document.getElementById('results').innerHTML = '<p style="color:var(--muted)">Place <code>/sitemap.json</code> or <code>/sitemap.xml</code> at the site root.</p>'
    }

    function normalizeFromJSON(data){
      // data.pages or data.posts
      const arr = data.pages || data.posts || data.items || [];
      return arr.map(o=>({ title: o.title || o.name || o.url, url: o.url, date: o.date || o.lastmod || o.pubdate, tags: o.tags || o.categories || [] }));
    }

    function parseSitemapXML(xmlText){
      try{
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, 'application/xml');
        const urlNodes = doc.querySelectorAll('url');
        const items = [];
        urlNodes.forEach(u=>{
          const loc = u.querySelector('loc')?.textContent?.trim();
          const lastmod = u.querySelector('lastmod')?.textContent?.trim();
          if(loc) items.push({ title: loc.replace(location.origin,'').replace(/^\//,''), url: loc, date: lastmod, tags: [] });
        });
        return items;
      }catch(e){ console.error('XML parse', e); return [] }
    }

    function wireFiltering(items){
      const searchEl = document.getElementById('search');
      const tagEl = document.getElementById('filterTags');
      function update(){ const filtered = filterItems(items); render(filtered); document.getElementById('stats').textContent = `${filtered.length} / ${items.length} shown`; }
      searchEl.addEventListener('input', update);
      tagEl.addEventListener('change', update);
    }

    // Start
    loadSitemap();
  </script>
</body>
</html>
